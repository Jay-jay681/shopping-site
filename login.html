<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    header{
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 1rem 2rem;
    background-color: rgb(255, 255, 255);
    color: black;
    width: 100%;
    box-shadow: 0 10px 12px rgba(0,0,0, 0.2);
}

/* LOGOS AND SEARCH BUTTON AND LINKS*/
.navbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo .search_container{
    flex: 1;
}

.nav_link{
    display: flex;
    justify-content: flex-end;
    list-style: none;
    gap: 15px;
}

.search_container{
    display: flex;
    justify-content: center;
}

.search_container input{
    /* width: 40%; */
    padding: 5px 15px;
    border-radius: 15px;
    border: 1px solid black;
}

/* HEADER ANOCHOR TAGS */
.nav_link li a{
    color: black;
    text-decoration: none;
}
/* .nav_link li a:last-child:hover{
    background-color: black;
} */

.nav_link li a:hover{
    color: black;
    font-weight: bolder;
    transition: 0.5s ease-in-out;
}

    body{
      height:100vh;
      background:bisque;
    }
    .body{
      display:flex;
      justify-content:center;
        align-items:center;
    }

    .signup-container{
      width:100%;
      max-width:400px;
      background:white;
      padding:40px 30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .signup-container h1{
      text-align:center;
      margin-bottom:10px;
      color:#111827;
      font-size:32px;
    }

    .signup-container p{
      text-align:center;
      color:#6b7280;
      margin-bottom:30px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      color:#374151;
      font-weight:600;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      outline:none;
      font-size:15px;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,0.15);
    }

    .signup-btn{
      width:100%;
      padding:14px;
      border:none;
      background:#2563eb;
      color:white;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .signup-btn:hover{
      background:#1d4ed8;
    }
    .error{
        margin-bottom: 3px;
        padding: 6px;
        background: red ;
        border-radius :5px;
    }

    .login-text{
      text-align:center;
      margin-top:20px;
      font-size:14px;
      color:#6b7280;
    }

    .login-text a{
      color:#2563eb;
      text-decoration:none;
      font-weight:bold;
    }

    .login-text a:hover{
      text-decoration:underline;
    }

    @media (max-width:500px){
      .signup-container{
        padding:30px 20px;
      }

      .signup-container h1{
        font-size:26px;
      }
    }
  </style>
</head>

<header>
    <nav class="navbar">
        <h1 class="logo">
            LOGO
        </h1>

         <ul class="nav_link">
            <li><a href="#">Men</a></li>
            <li><a href="#">Women</a></li>
            <li><a href="#">Unisex</a></li>
            <li><a href="#">Assessories</a></li>
            <li><a href="#">Shop collections</a></li>
        </ul>

        <div class="search_container">
            <input type="text" placeholder="Search here">
        </div>
    </nav>   
    </header>

<body>
<div class="body">
  <div class="signup-container">
    <h1>Login account</h1>
    <p>Login to continue</p>

    <form method="post" action="/login/">
        {% csrf_token %}
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password">
      </div>


      {{ form.errors }}

      <!-- {% if form.errors or form.non_field_errors %}
         <div class="erros">
            {% for field in form %}
                {{ field.errors }}
            {% endfor %}
            {{ form.non_field_errors }}
         </div>
         
        {% endif %} -->

        {% for message in messages %}
        <div class="error">
            {{ message }}
        </div>
        {% endfor %}


      <button class="signup-btn">Login</button>
    </form>

    <div class="login-text">
       Don't have an account?
      <a href="{% url 'signup' %}">Sign Up</a>
    </div>
  </div>
</div>

</body>
</html>
